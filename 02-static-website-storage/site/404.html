<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    main {
      max-width: 620px;
      background: #ffffff;
      border: 1px solid #e6eaf0;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
    }

    h1 {
      font-size: 56px;
      margin: 0 0 12px;
    }

    p {
      font-size: 18px;
      color: #5f6b7a;
      line-height: 1.7;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>
      Page not found. This custom error page is served from the Azure Storage
      Static Website $web container.
    </p>
  </main>
</body>
</html>
